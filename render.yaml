services:
  - type: web
    name: opportunitypulse
    runtime: docker
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_COLLECTOR_ID
        sync: false
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
